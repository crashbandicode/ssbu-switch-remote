[package]
name = "ssbu-switch-remote"
version = "0.2.0"
edition = "2021"
publish = false
description = "Skyline plugin for Super Smash Bros. Ultimate 13.0.5 that reports the game's scene (offline or online) to the switch-remote sysmodule, so remote input stays off online"
license = "MIT"

[package.metadata.skyline]
titleid = "01006A800016E000"

[features]
# Eden/diagnostic builds only: logs every mode change and connection event. Never in the shipped NRO.
diag = []

[lib]
# cdylib only: Cargo skips LTO for a library that is also an rlib.
crate-type = ["cdylib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = 2
strip = false
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
